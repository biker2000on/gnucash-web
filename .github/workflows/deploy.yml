name: Build and Push Docker Image

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  # This repository-owned package is intentionally distinct from the legacy
  # PAT-published package so GITHUB_TOKEN receives package admin on creation.
  IMAGE_NAME: ${{ github.repository }}-app

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Real PostgreSQL for the integration tier. The concurrency guarantees this
    # codebase depends on - FOR UPDATE, lock ordering, advisory locks - are not
    # observable through a mocked pool, so a regression that drops a parent
    # lock passes a mock-only suite. Matches the 17 in docker-compose.prod.yml
    # so CI cannot pass on behaviour production does not have.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gnucash
          # Throwaway credentials for a container that lives for one job and is
          # reachable only from it. Nothing here is a secret.
          POSTGRES_PASSWORD: gnucash
          POSTGRES_DB: gnucash_test
        ports:
          - 5432:5432
        # Without a healthcheck the first step to connect races the server's
        # initdb and fails with ECONNREFUSED.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://gnucash:gnucash@localhost:5432/gnucash_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run typecheck
        run: npm run typecheck

      - name: Verify documentation coverage
        run: npm run docs:check

      - name: Run unit tests
        run: npm run test:run

      # Split from the run above so a red build says which half broke. The
      # schema step comes first and separately for the same reason: "the
      # database was never built" and "the code is wrong" are different
      # problems and should not share a step name.
      - name: Create integration database schema
        run: npm run test:integration:schema

      - name: Run integration tests
        run: npm run test:integration

      # This test provisions a second, self-contained PostgreSQL container via
      # docker's explicit default context. It does not share TEST_DATABASE_URL,
      # so keeping it separate preserves the integration tier's no-truncate
      # contract while still making the Prisma adapter error-shape proof a CI
      # gate.
      - name: Run Prisma deadlock oracle proof
        run: npm run test:prisma-deadlock-oracle

      - name: Run lint
        run: npm run lint

  build-and-push:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      # contents: write - the deploy pointer below is a branch push.
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Advancing this branch is what tells production to deploy. It happens
      # only AFTER the image is in the registry, which is the whole point:
      # Dockhand watches the branch, so a git-commit trigger would otherwise
      # race the build and deploy the PREVIOUS image, then record the commit
      # as done and never retry.
      #
      # This replaced an HTTP webhook that could not work: Dockhand runs the
      # deploy inside the request, and the pull+recreate exceeds Cloudflare's
      # 100s limit, so the connection dropped and killed the deploy mid-flight
      # - while the retry reported success because the commit was already
      # synced. Deploys silently never reached production. The scheduler that
      # picks this branch up runs in the background with no request attached,
      # so it cannot be killed that way.
      - name: Advance deploy pointer
        # A REST ref update, not `git push`: actions/checkout is shallow, so
        # the runner cannot prove a fast-forward locally and git rejects the
        # push. The server still enforces fast-forward here (force defaults to
        # false), so a stale re-run cannot walk production backwards.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            "repos/${{ github.repository }}/git/refs/heads/deploy" \
            -f sha='${{ github.sha }}' \
            || gh api --method POST "repos/${{ github.repository }}/git/refs" \
                 -f ref=refs/heads/deploy -f sha='${{ github.sha }}'

      # Production is only deployed when it actually serves the new revision.
      # /api/health reports the commit baked into the running image, so this
      # turns a silent non-deploy into a red build.
      - name: Verify production is serving this revision
        env:
          HEALTH_URL: https://cash.adventureintandem.com/api/health
          EXPECTED: ${{ github.sha }}
        run: |
          short="${EXPECTED:0:7}"
          # Dockhand polls the deploy branch every 5 minutes, then pulls and
          # recreates; 15 minutes covers a slow pull on the NAS pool.
          deadline=$(( SECONDS + 900 ))
          while [ "$SECONDS" -lt "$deadline" ]; do
            actual=$(curl -fsS --max-time 20 "$HEALTH_URL" 2>/dev/null \
              | sed -n 's/.*"revision":"\([^"]*\)".*/\1/p') || actual=""
            if [ "$actual" = "$short" ]; then
              echo "Production is serving $short."
              exit 0
            fi
            echo "waiting - production reports '${actual:-unreachable}', want '$short'"
            sleep 30
          done
          echo "::error::Production did not reach $short within 15 minutes."
          echo "Check the stack, then deploy by hand on the TrueNAS host:"
          echo "  cd /mnt/docker/volumes/dockhand/stacks/Truenas/gnucash-web-prod && \\"
          echo "  docker compose -p gnucash-web-prod -f docker-compose.prod.yml \\"
          echo "    --env-file .env.dockhand up -d --remove-orphans --force-recreate"
          exit 1
