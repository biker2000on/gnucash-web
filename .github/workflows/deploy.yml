name: Build and Push Docker Image

on:
  push:
    branches: [main]
  # Gate pull requests on the same `quality` job that gates main. Only that
  # job runs here - `build-and-push` is guarded on `github.event_name` below,
  # so a PR never publishes an image or moves the deploy pointer.
  #
  # paths-ignore is deliberately on this trigger ONLY. On `push` it would also
  # skip `build-and-push`, and a prose-only change still has to be able to
  # reach production; those pushes are instead skipped with `[skip ci]` in the
  # commit message when the author wants that. Nothing under `docs/` or any
  # *.md file is read by the quality job - `docs:check` validates the
  # TypeScript feature registry, not the markdown - so ignoring them here
  # costs no coverage and keeps TODOS.md-only PRs free.
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

# One in-flight run per pull request: a force-push should cancel the run it
# supersedes rather than paying for both. Pushes to main are keyed by ref and
# never cancelled - cancelling one mid-flight could leave the deploy pointer
# advanced with no image behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  # This repository-owned package is intentionally distinct from the legacy
  # PAT-published package so GITHUB_TOKEN receives package admin on creation.
  IMAGE_NAME: ${{ github.repository }}-app

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Real PostgreSQL for the integration tier. The concurrency guarantees this
    # codebase depends on - FOR UPDATE, lock ordering, advisory locks - are not
    # observable through a mocked pool, so a regression that drops a parent
    # lock passes a mock-only suite. Matches the 17 in docker-compose.prod.yml
    # so CI cannot pass on behaviour production does not have.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gnucash
          # Throwaway credentials for a container that lives for one job and is
          # reachable only from it. Nothing here is a secret.
          POSTGRES_PASSWORD: gnucash
          POSTGRES_DB: gnucash_test
        ports:
          - 5432:5432
        # Without a healthcheck the first step to connect races the server's
        # initdb and fails with ECONNREFUSED.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://gnucash:gnucash@localhost:5432/gnucash_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run typecheck
        run: npm run typecheck

      # The Docker stage builds the app too, but only after `quality` has
      # passed and only on main - so a PR that compiles under `tsc` and still
      # fails `next build` (a bad "use client" boundary, a server-only import
      # pulled into a Client Component, a route that will not statically
      # analyse) was previously invisible until the deploy build. This is the
      # cheap place to find it.
      - name: Restore Next.js build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .next/cache
          # Sources in the key, lockfile as the fallback: a source change gets
          # a fresh entry but still restores the previous build's cache, which
          # is what makes the incremental compile cheap.
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.js', 'tsconfig.json') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - name: Build the application
        # Placeholders only. The build must not reach a database - the Docker
        # builder proves that by running `npm run build` with no environment at
        # all - so anything that starts connecting during the build fails here
        # with a bad host rather than silently depending on CI having a DB.
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:1/build_should_not_connect
          SESSION_SECRET: ci-build-placeholder-secret-not-used-at-runtime
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Verify documentation coverage
        run: npm run docs:check

      # Coverage instead of a bare `vitest run`: it is the same single suite
      # execution, and it turns "someone deleted a test file" into a red build
      # via the thresholds in vitest.config.ts.
      - name: Run unit tests with coverage
        run: npm run test:coverage

      # Split from the run above so a red build says which half broke. The
      # schema step comes first and separately for the same reason: "the
      # database was never built" and "the code is wrong" are different
      # problems and should not share a step name.
      - name: Create integration database schema
        run: npm run test:integration:schema

      - name: Run integration tests
        run: npm run test:integration

      # This test provisions a second, self-contained PostgreSQL container via
      # docker's explicit default context. It does not share TEST_DATABASE_URL,
      # so keeping it separate preserves the integration tier's no-truncate
      # contract while still making the Prisma adapter error-shape proof a CI
      # gate.
      - name: Run Prisma deadlock oracle proof
        run: npm run test:prisma-deadlock-oracle

      - name: Run lint
        run: npm run lint

      # Uploaded even when an earlier step failed: on a red run the lcov is
      # how you see whether the gap is new or pre-existing.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ github.sha }}
          path: |
            coverage/lcov.info
            coverage/coverage-summary.json
          if-no-files-found: warn
          retention-days: 14

  build-and-push:
    needs: quality
    # Pull requests stop at `quality`. Publishing an image, advancing the
    # deploy pointer and probing production are all push-to-main actions.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      # contents: write - the deploy pointer below is a branch push.
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Advancing this branch is what tells production to deploy. It happens
      # only AFTER the image is in the registry, which is the whole point:
      # Dockhand watches the branch, so a git-commit trigger would otherwise
      # race the build and deploy the PREVIOUS image, then record the commit
      # as done and never retry.
      #
      # This replaced an HTTP webhook that could not work: Dockhand runs the
      # deploy inside the request, and the pull+recreate exceeds Cloudflare's
      # 100s limit, so the connection dropped and killed the deploy mid-flight
      # - while the retry reported success because the commit was already
      # synced. Deploys silently never reached production. The scheduler that
      # picks this branch up runs in the background with no request attached,
      # so it cannot be killed that way.
      - name: Advance deploy pointer
        # A REST ref update, not `git push`: actions/checkout is shallow, so
        # the runner cannot prove a fast-forward locally and git rejects the
        # push. The server still enforces fast-forward here (force defaults to
        # false), so a stale re-run cannot walk production backwards.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            "repos/${{ github.repository }}/git/refs/heads/deploy" \
            -f sha='${{ github.sha }}' \
            || gh api --method POST "repos/${{ github.repository }}/git/refs" \
                 -f ref=refs/heads/deploy -f sha='${{ github.sha }}'

      # Production is only deployed when it actually serves the new revision.
      # /api/health reports the commit baked into the running image, so this
      # turns a silent non-deploy into a red build.
      - name: Verify production is serving this revision
        env:
          HEALTH_URL: https://cash.adventureintandem.com/api/health
          EXPECTED: ${{ github.sha }}
        run: |
          short="${EXPECTED:0:7}"
          # Dockhand polls the deploy branch every 5 minutes, then pulls and
          # recreates; 15 minutes covers a slow pull on the NAS pool.
          deadline=$(( SECONDS + 900 ))
          while [ "$SECONDS" -lt "$deadline" ]; do
            actual=$(curl -fsS --max-time 20 "$HEALTH_URL" 2>/dev/null \
              | sed -n 's/.*"revision":"\([^"]*\)".*/\1/p') || actual=""
            if [ "$actual" = "$short" ]; then
              echo "Production is serving $short."
              exit 0
            fi
            echo "waiting - production reports '${actual:-unreachable}', want '$short'"
            sleep 30
          done
          echo "::error::Production did not reach $short within 15 minutes."
          echo "Check the stack, then deploy by hand on the TrueNAS host:"
          echo "  cd /mnt/docker/volumes/dockhand/stacks/Truenas/gnucash-web-prod && \\"
          echo "  docker compose -p gnucash-web-prod -f docker-compose.prod.yml \\"
          echo "    --env-file .env.dockhand up -d --remove-orphans --force-recreate"
          exit 1
