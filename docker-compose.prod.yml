# GnuCash Web - Production Docker Compose
#
# Uses pre-built images from ghcr.io.
#
# Required: Create a .env file with:
#   NEXTAUTH_SECRET=<generate with: openssl rand -base64 32>
#   NEXTAUTH_URL=http://<host-ip>:3000
#
# Database is auto-configured from POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB.
#
# Optional:
#   APP_PORT=3000                 # Host port for the web app
#   POSTGRES_PORT=5432            # Host-local PostgreSQL port
#   MINIO_API_PORT=9000           # Host port for MinIO API
#   MINIO_CONSOLE_PORT=9001       # Host port for MinIO console
#   POSTGRES_DATA_DIR=./postgres-data  # Local folder for PostgreSQL data
#   MINIO_DATA_DIR=./minio-data       # Local folder for MinIO storage
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml logs -f

services:
  app:
    image: ${IMAGE_REPOSITORY:-ghcr.io/biker2000on/gnucash-web-app}:${IMAGE_TAG:-latest}
    pull_policy: always
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-gnucash}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-gnucash}
      - REDIS_URL=redis://redis:6379
      - SESSION_SECRET=${SESSION_SECRET:-}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - AI_BASE_URL=${AI_BASE_URL:-}
      - AI_MODEL=${AI_MODEL:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - RECEIPT_STORAGE=${RECEIPT_STORAGE:-s3}
      - RECEIPT_S3_ENDPOINT=${RECEIPT_S3_ENDPOINT:-http://minio:9000}
      - RECEIPT_S3_BUCKET=${RECEIPT_S3_BUCKET:-gnucash-receipts}
      - RECEIPT_S3_REGION=${RECEIPT_S3_REGION:-us-east-1}
      - RECEIPT_S3_ACCESS_KEY=${RECEIPT_S3_ACCESS_KEY:-${MINIO_ROOT_USER:-minioadmin}}
      - RECEIPT_S3_SECRET_KEY=${RECEIPT_S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin}}
      # Optional OIDC login (all empty = OIDC disabled)
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_PROVIDER_NAME=${OIDC_PROVIDER_NAME:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      createbuckets:
        condition: service_completed_successfully
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cash.rule=Host(`cash.adventureintandem.com`)"
      - "traefik.http.routers.cash.entrypoints=websecure"
      - "traefik.http.routers.cash.tls=true"
      - "traefik.http.routers.cash.tls.certresolver=cloudflare"
      - "traefik.http.routers.cash.tls.domains[0].main=adventureintandem.com"
      - "traefik.http.routers.cash.tls.domains[0].sans=*.adventureintandem.com"
      - "traefik.http.services.cash.loadbalancer.server.port=3000"

  worker:
    image: ${IMAGE_REPOSITORY:-ghcr.io/biker2000on/gnucash-web-app}:${IMAGE_TAG:-latest}
    pull_policy: always
    command: ["node", "worker.js"]
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-gnucash}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-gnucash}
      - REDIS_URL=redis://redis:6379
      - WORKER_HEALTH_PORT=9090
      # The worker decrypts stored connector credentials (SimpleFin, Fuel
      # Tracker) and loads modules that seal sessions, so it needs the same
      # secret as the app. Without it the process refuses to start.
      - SESSION_SECRET=${SESSION_SECRET:-}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - AI_BASE_URL=${AI_BASE_URL:-}
      - AI_MODEL=${AI_MODEL:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - RECEIPT_STORAGE=${RECEIPT_STORAGE:-s3}
      - RECEIPT_S3_ENDPOINT=${RECEIPT_S3_ENDPOINT:-http://minio:9000}
      - RECEIPT_S3_BUCKET=${RECEIPT_S3_BUCKET:-gnucash-receipts}
      - RECEIPT_S3_REGION=${RECEIPT_S3_REGION:-us-east-1}
      - RECEIPT_S3_ACCESS_KEY=${RECEIPT_S3_ACCESS_KEY:-${MINIO_ROOT_USER:-minioadmin}}
      - RECEIPT_S3_SECRET_KEY=${RECEIPT_S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      createbuckets:
        condition: service_completed_successfully
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:17-alpine
    ports:
      # Host-local only by design. Use SSH port-forwarding for remote access,
      # never rebind this to 0.0.0.0; remove this mapping when no local tooling needs it.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gnucash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-gnucash}
    volumes:
      - ${POSTGRES_DATA_DIR:-./postgres-data}:/var/lib/postgresql/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gnucash}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---- S3-compatible storage via MinIO ----
  minio:
    image: minio/minio
    ports:
      # The app uses the Compose network. Keep S3 and its console host-local;
      # use SSH port-forwarding for remote administration.
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ${MINIO_DATA_DIR:-./minio-data}:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "mc alias set local http://localhost:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} >/dev/null 2>&1 && mc ls local >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Create default buckets on first run
  createbuckets:
    image: minio/minio
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command: >
      -c "
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing myminio/${RECEIPT_S3_BUCKET:-gnucash-receipts};
      echo 'Bucket ready';
      "
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


volumes:
  redis-data:
